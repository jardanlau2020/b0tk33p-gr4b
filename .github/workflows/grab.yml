name: botkeep-grab
run-name: ${{ inputs.source == 'worker' && 'Worker 定时触发' || (inputs.source == 'chain' && '自链触发' || '手动触发') }}

on:
  schedule:
    # GitHub 原生排程（5 分钟）；实际会被抽稀到 5-20 分钟。
    # CF 免费版 cron 名額已用盡（5/5），所以用原生排程 + 自鏈 + Worker 手動補觸發。
    - cron: '*/5 * * * *'
  workflow_dispatch: # 手動觸發（也可由 Worker 補觸發）；可勾选重置冷却/运行次数
    inputs:
      reset:
        description: "重置冷却，立即开抢"
        type: boolean
        default: false
      reset_count:
        description: "重置运行次数和尝试领取次数（从 0 重新计数）"
        type: boolean
        default: false
      source:
        description: "触发来源（Worker 传 worker）"
        type: string
        default: manual

permissions:
  contents: read
  actions: write # 用于删除旧的运行记录

concurrency:
  group: botkeep-grab
  cancel-in-progress: false

jobs:
  # ══════════════ 帳號 1（BOTKEEP_EMAIL / BOTKEEP_PASSWORD）══════════════
  grab-a1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore cooldown
        uses: actions/cache/restore@v4
        with:
          path: .cooldown/a1
          key: botkeep-cooldown-a1-${{ github.run_id }}
          restore-keys: botkeep-cooldown-a1-

      - name: Read cooldown
        id: pre
        run: echo "v=$(cat .cooldown/a1/* 2>/dev/null | md5sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      - name: Reset cooldown
        if: inputs.reset
        run: mkdir -p .cooldown/a1 && echo 0 > .cooldown/a1/until

      - name: Reset run count
        if: inputs.reset_count
        run: rm -f .cooldown/a1/notify.json

      - name: Cache proxy tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sing-box-1.14.1
            node_modules
          key: proxy-tools-singbox-1.14.1-undici-v1

      - name: Start proxy
        id: proxy
        env:
          NODE_LINK: ${{ secrets.PROXY_URL || secrets.NODE_LINK }}
        run: |
          if [ -n "$NODE_LINK" ]; then
            if [ ! -d node_modules/undici ]; then
              echo '{}' > package.json
              npm i --no-save --no-package-lock --no-audit --no-fund undici >/dev/null
            fi
            python3 start_proxy.py
          fi

      - name: Grab Botkeep server
        run: node grab.mjs
        env:
          BOTKEEP_EMAIL: ${{ secrets.BOTKEEP_EMAIL }}
          BOTKEEP_PASSWORD: ${{ secrets.BOTKEEP_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          COOLDOWN_FILE: .cooldown/a1/until
          TRIGGER: ${{ inputs.source == 'worker' && 'Worker 定时' || '手动' }}
          TRIGGER_SOURCE: ${{ inputs.source }}
          NOTIFY_EVERY_MINUTES: "60"
          INCLUDE_NODES: "node10"
          EXCLUDE_NODES: ""
          RUNTIME: "python"
          RAM_MB: "512"
          CPU_PERCENT: "50"
          STORAGE_MB: "1024"
          COOLDOWN_MINUTES: "3"
          SUCCESS_COOLDOWN_MINUTES: "1440"
          RUN_SECONDS: "240"
          INTERVAL_SECONDS: "20"

      - name: Check cooldown change
        id: post
        if: always()
        run: echo "v=$(cat .cooldown/a1/* 2>/dev/null | md5sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      - name: Save cooldown
        if: always() && hashFiles('.cooldown/a1/*') != '' && steps.post.outputs.v != steps.pre.outputs.v
        uses: actions/cache/save@v4
        with:
          path: .cooldown/a1
          key: botkeep-cooldown-a1-${{ github.run_id }}

  # ══════════════ 帳號 2（BOTKEEP_EMAIL_2 / BOTKEEP_PASSWORD_2）══════════════
  grab-a2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore cooldown
        uses: actions/cache/restore@v4
        with:
          path: .cooldown/a2
          key: botkeep-cooldown-a2-${{ github.run_id }}
          restore-keys: botkeep-cooldown-a2-

      - name: Read cooldown
        id: pre
        run: echo "v=$(cat .cooldown/a2/* 2>/dev/null | md5sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      - name: Reset cooldown
        if: inputs.reset
        run: mkdir -p .cooldown/a2 && echo 0 > .cooldown/a2/until

      - name: Reset run count
        if: inputs.reset_count
        run: rm -f .cooldown/a2/notify.json

      - name: Cache proxy tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sing-box-1.14.1
            node_modules
          key: proxy-tools-singbox-1.14.1-undici-v1

      - name: Start proxy
        id: proxy
        env:
          NODE_LINK: ${{ secrets.PROXY_URL || secrets.NODE_LINK }}
        run: |
          if [ -n "$NODE_LINK" ]; then
            if [ ! -d node_modules/undici ]; then
              echo '{}' > package.json
              npm i --no-save --no-package-lock --no-audit --no-fund undici >/dev/null
            fi
            python3 start_proxy.py
          fi

      # 錯峰：a2 遲 60 秒先開搶，同 a1 覆蓋唔同時間點（兩 job 本來已係唔同 runner／IP）
      - name: Stagger (错峰 60s)
        run: sleep 60

      - name: Grab Botkeep server
        run: node grab.mjs
        env:
          BOTKEEP_EMAIL: ${{ secrets.BOTKEEP_EMAIL_2 }}
          BOTKEEP_PASSWORD: ${{ secrets.BOTKEEP_PASSWORD_2 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          COOLDOWN_FILE: .cooldown/a2/until
          TRIGGER: ${{ inputs.source == 'worker' && 'Worker 定时' || '手动' }}
          TRIGGER_SOURCE: ${{ inputs.source }}
          NOTIFY_EVERY_MINUTES: "60"
          INCLUDE_NODES: "node10"
          EXCLUDE_NODES: ""
          RUNTIME: "python"
          RAM_MB: "512"
          CPU_PERCENT: "50"
          STORAGE_MB: "1024"
          COOLDOWN_MINUTES: "3"
          SUCCESS_COOLDOWN_MINUTES: "1440"
          RUN_SECONDS: "240"
          INTERVAL_SECONDS: "20"

      - name: Check cooldown change
        id: post
        if: always()
        run: echo "v=$(cat .cooldown/a2/* 2>/dev/null | md5sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      - name: Save cooldown
        if: always() && hashFiles('.cooldown/a2/*') != '' && steps.post.outputs.v != steps.pre.outputs.v
        uses: actions/cache/save@v4
        with:
          path: .cooldown/a2
          key: botkeep-cooldown-a2-${{ github.run_id }}

  # ══════════════ 帳號 3（BOTKEEP_EMAIL_3 / BOTKEEP_PASSWORD_3）══════════════
  grab-a3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore cooldown
        uses: actions/cache/restore@v4
        with:
          path: .cooldown/a3
          key: botkeep-cooldown-a3-${{ github.run_id }}
          restore-keys: botkeep-cooldown-a3-

      - name: Read cooldown
        id: pre
        run: echo "v=$(cat .cooldown/a3/* 2>/dev/null | md5sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      - name: Reset cooldown
        if: inputs.reset
        run: mkdir -p .cooldown/a3 && echo 0 > .cooldown/a3/until

      - name: Reset run count
        if: inputs.reset_count
        run: rm -f .cooldown/a3/notify.json

      - name: Cache proxy tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sing-box-1.14.1
            node_modules
          key: proxy-tools-singbox-1.14.1-undici-v1

      - name: Start proxy
        id: proxy
        env:
          NODE_LINK: ${{ secrets.PROXY_URL || secrets.NODE_LINK }}
        run: |
          if [ -n "$NODE_LINK" ]; then
            if [ ! -d node_modules/undici ]; then
              echo '{}' > package.json
              npm i --no-save --no-package-lock --no-audit --no-fund undici >/dev/null
            fi
            python3 start_proxy.py
          fi

      # 錯峰：a2 遲 60 秒先開搶，同 a1 覆蓋唔同時間點（兩 job 本來已係唔同 runner／IP）
      - name: Stagger (错峰 120s)
        run: sleep 120

      - name: Grab Botkeep server
        run: node grab.mjs
        env:
          BOTKEEP_EMAIL: ${{ secrets.BOTKEEP_EMAIL_3 }}
          BOTKEEP_PASSWORD: ${{ secrets.BOTKEEP_PASSWORD_3 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          COOLDOWN_FILE: .cooldown/a3/until
          TRIGGER: ${{ inputs.source == 'worker' && 'Worker 定时' || '手动' }}
          TRIGGER_SOURCE: ${{ inputs.source }}
          NOTIFY_EVERY_MINUTES: "60"
          INCLUDE_NODES: "node10"
          EXCLUDE_NODES: ""
          RUNTIME: "python"
          RAM_MB: "512"
          CPU_PERCENT: "50"
          STORAGE_MB: "1024"
          COOLDOWN_MINUTES: "3"
          SUCCESS_COOLDOWN_MINUTES: "1440"
          RUN_SECONDS: "240"
          INTERVAL_SECONDS: "20"

      - name: Check cooldown change
        id: post
        if: always()
        run: echo "v=$(cat .cooldown/a3/* 2>/dev/null | md5sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      - name: Save cooldown
        if: always() && hashFiles('.cooldown/a3/*') != '' && steps.post.outputs.v != steps.pre.outputs.v
        uses: actions/cache/save@v4
        with:
          path: .cooldown/a3
          key: botkeep-cooldown-a3-${{ github.run_id }}

  # ══════════════ 自鏈 + 清理（兩個帳號都跑完先派下一轉）══════════════
  chain:
    needs: [grab-a1, grab-a2, grab-a3]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Chain next run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN: ${{ github.run_id }}
        run: |
          set -e
          Q=$(gh api "repos/$REPO/actions/workflows/grab.yml/runs?per_page=20" \
              -q "[.workflow_runs[] | select(.id != ${SELF_RUN} and (.status==\"in_progress\" or .status==\"queued\"))] | length")
          if [ "${Q:-0}" -ge 1 ]; then echo "已有 $Q 個 run 排隊/執行中，跳過派鏈"; exit 0; fi
          sleep 120
          gh api -X POST "repos/$REPO/actions/workflows/grab.yml/dispatches" \
            -f ref=main -f "inputs[source]=chain" > /dev/null
          echo "✅ 已派下一次（source=chain）"

      - name: Clean old runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/actions/workflows/grab.yml/runs?per_page=100" --paginate \
            -q '.workflow_runs[] | select(.status=="completed") | .id' \
            | tail -n +11 \
            | xargs -r -I{} gh api -X DELETE "repos/$REPO/actions/runs/{}" || true
          gh api "repos/$REPO/actions/caches?key=botkeep-cooldown-&sort=created_at&direction=desc&per_page=100" \
            -q '.actions_caches[].id' \
            | tail -n +7 \
            | xargs -r -I{} gh api -X DELETE "repos/$REPO/actions/caches/{}" || true
